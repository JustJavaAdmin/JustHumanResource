spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/humanresource}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:alaopost}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
        types:
          print:
            banner: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${openaiAPI_KEY}
      model: gpt-4o-mini
      chat:
        options:
          model: gpt-4o-mini
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${ISSUER_URI:https://ngcloak-production.up.railway.app/realms/humanResources-azure}

          keycloak-mobile:
            issuer-uri: ${ISSUER_URI_E:https://ngcloak-production.up.railway.app/realms/employees-azure}

          keycloak-web:
            issuer-uri: ${ISSUER_URI_E:https://ngcloak-production.up.railway.app/realms/employees-azure}

        registration:
          keycloak:
            provider: keycloak
            client_id: ${KEYCLOAK_CLIENT_ID:humanResources-azure}
            client_secret: ${KEYCLOAK_CLIENT_SECRET:Owg1lFWbx72EZbA0AA5cl95MKdUbzNxsTGfbquI3XilFo2OP6WUBwZasZkyQsEYpCIJLYggcMUGu1B7fCqYAVY}
            authorization-grant-type: authorization_code
            scope: openid,profile,email

          keycloak-mobile:
            provider: keycloak-mobile
            client_id: ${KEYCLOAK_CLIENT_ID_E:employees-azure}
            client_secret: ${KEYCLOAK_CLIENT_SECRET_E:SWP65Cf0hpHxVOr6J05fFvWoqYvofYVMFYEBGtPevKOGa6BVqeZ9Po7fhoxIuxCH2Kh0PIqBbBHc7ylMwek7qY}
            authorization-grant-type: authorization_code
            scope: openid,profile,email

          keycloak-web:
            provider: keycloak-web
            client_id: ${KEYCLOAK_CLIENT_ID_E:employees-azure}
            client_secret: ${KEYCLOAK_CLIENT_SECRET_E:SWP65Cf0hpHxVOr6J05fFvWoqYvofYVMFYEBGtPevKOGa6BVqeZ9Po7fhoxIuxCH2Kh0PIqBbBHc7ylMwek7qY}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      ProcessModelIdUnique: PROCESS_MODEL_ID_UNIQUE
      ProcessProcessNameUnique: PROCESS_PROCESS_NAME_UNIQUE
      ValidFileType: VALID_FILE_TYPE
server:
  forward-headers-strategy: native
  tomcat:
    max-part-count: '100'

springdoc:
  pathsToMatch: /api/**
keycloak:
  base-url: ${KEYCLOAK_BASE_URI:https://ngcloak-production.up.railway.app}
  base-realm: humanResources-azure
  client-id: ${KEYCLOAK_CLIENT_ID:humanResources-azure}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:Owg1lFWbx72EZbA0AA5cl95MKdUbzNxsTGfbquI3XilFo2OP6WUBwZasZkyQsEYpCIJLYggcMUGu1B7fCqYAVY}
  realm: employees-azure
