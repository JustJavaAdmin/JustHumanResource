# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - JustHR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
        
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Uploading only the specific jar file to avoid nesting issues
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/humanresource-0.0.1-SNAPSHOT.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build 
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ${{ github.workspace }} # Downloads the jar directly to workspace root
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_92E8CCE4D96943BE9657B12EF72D4497 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_455B7CA117C64C1F89AE84C707040C63 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_22B204B6745A4BDE9DEB01C94A01E729 }}
              
      - name: Check downloaded files
        run: |
            pwd
            ls -lah
            file humanresource-0.0.1-SNAPSHOT.jar

      - name: Inspect JAR
        run: |
            jar tf humanresource-0.0.1-SNAPSHOT.jar | head -20
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'JustHR' # Corrected to your actual App Service resource name
          slot-name: 'Production'
          package: '${{ github.workspace }}/humanresource-0.0.1-SNAPSHOT.jar' # Simplified path
          # justhr-cvd6fmbhfpc9dzdn
