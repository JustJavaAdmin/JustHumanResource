# # Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# # More GitHub Actions for Azure: https://github.com/Azure/actionss

name: build-JustHumanResource
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install glibc
        run: sudo apt-get update && sudo apt-get install -y libc6

  build-image:
    name: Build and push to docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and Push with Jib
        run: |
          mvn -B clean package jib:build -DskipTests \
            -Djib.to.image=kazeemakinrinde/justhumanresource:${{ github.run_number }} \
            -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD }}

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'JustHR2' # Replace with your exact Azure Web App name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'kazeemakinrinde/justhumanresource:${{ github.run_number }}'
